[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbextractors"
# The version has a **single** source: `src/dbextractors/__init__.py`, read
# statically from the AST without importing the package. It used to be written
# in both places and they drifted apart — the metadata said one version while
# the running package logged another.
dynamic = ["version"]
description = "Table extraction from MySQL, MSSQL, PostgreSQL and Firebird into PostgreSQL"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Robert Junek", email = "robert@bisuperhero.cz" }]
keywords = ["etl", "postgresql", "mysql", "mssql", "firebird", "data-pipeline", "dagster"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

# Python 3.11 is the floor: the runtime is Dagster on a current Python, and the
# last release for the Mage 0.9.79 image (Python 3.10) is the v1.0.x line —
# Mage deployments stay on it. No upper bound, so a new Python does not need a
# release of this package to be installable; CI says which ones are tested.
requires-python = ">=3.11"

# Ranges, not pins: the package is installed next to whatever the orchestrator
# brings. The upper bounds stop at the next major version — the one allowed to
# break an API this package relies on.
#
# The lower bound on pandas is not arbitrary. Every `row_hash` in production was
# computed under pandas 1.5.3, and the places where pandas 2 would compute a
# different one are handled explicitly (`core/hashing.py`, `core/coerce.py`)
# and pinned by golden tests with the 1.5.3 values hard-coded. Those tests are
# what a new pandas has to pass, not this range.
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# NOTE: an image that already ships `psycopg2` (built from source) should install
# bare `dbextractors` — `psycopg2-binary` next to it collides.
target = ["psycopg2-binary>=2.9.3,<3"]
mysql = ["mysql-connector-python>=9.1,<27"]  # 9.1 fixes CVE-2024-21272
mssql = ["pymssql>=2.3.13,<3"]
# `firebird-driver` is the maintained successor of `fdb`, and `sqlalchemy-firebird`
# 2.x is the SQLAlchemy 2 dialect on top of it (URL scheme `firebird+firebird`).
# It needs the Firebird 3+ client library, `libfbclient.so.2`, on the system.
firebird = ["sqlalchemy-firebird>=2,<3", "firebird-driver>=1.10,<2"]

# Empty on purpose, and kept rather than deleted so that `pip install
# dbextractors[ssh]` does not break for anyone who already writes it.
#
# SSH tunnelling here is not a Python library. `core/tunnel.py` runs the OpenSSH
# **binary** through `subprocess`, because the child needs `PR_SET_PDEATHSIG` —
# without it a failed run leaves an orphaned process holding the forwarded port
# open. Nothing in `src/` imports `paramiko` or `sshtunnel`; they were declared
# here because the implementations this package replaced used them.
#
# Two unused packages are not free. Both carry published advisories
# (CVE-2023-48795, and CVE-2026-44405 which has no fixed version at all), so
# every vulnerability scan of a `[ssh]` install reported findings against code
# that is never loaded. What tunnelling actually needs is an `ssh` client on
# PATH — a system dependency, which cannot be expressed here.
ssh = []

# The comparison harness. It runs standalone — it is a tool, not a test.
golden = ["psycopg2-binary>=2.9.3,<3", "PyYAML>=6.0,<7"]

dev = [
    # The source drivers are dev dependencies because the live source tests need
    # them; a deployment installs only the extras for the sources it actually
    # reads from.
    "dbextractors[target,golden,mysql,mssql,firebird]",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.urls]
Repository = "https://github.com/bisuperhero/dbextractors"
Changelog = "https://github.com/bisuperhero/dbextractors/blob/main/CHANGELOG.md"
Issues = "https://github.com/bisuperhero/dbextractors/issues"

[project.scripts]
dbx-golden = "dbextractors.golden.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dbextractors.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dbextractors*"]

[tool.setuptools.package-data]
dbextractors = ["py.typed"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "UP006",  # `dict` vs `Dict` — a style change across the codebase, not a fix
    "UP035",
    # No "UP038" any more: ruff removed the rule, so ignoring it only warns. Its
    # reason stands, though — `isinstance(x, int | np.integer)` builds a type
    # object on every call and is 1.9x slower than the tuple form (measured over
    # 2M calls: 0.196 s vs 0.105 s). In `core/coerce.py` these checks run on
    # every value of every column, so keep the tuple form there.
    #
    # Typographic characters (em dashes, curly quotes) are used throughout the
    # prose in docstrings and comments.
    "RUF001",  # ambiguous unicode in an identifier
    "RUF002",  # ambiguous unicode in a docstring
    "RUF003",  # ambiguous unicode in a comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Tightened gradually.
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_pg: requires a live PostgreSQL (DBX_GOLDEN_TEST_DSN)",
    "needs_mysql: requires a live MySQL (DBX_TEST_MYSQL_DSN)",
    "needs_mssql: requires a live MSSQL (DBX_TEST_MSSQL_DSN)",
    "needs_firebird: requires a live Firebird (DBX_TEST_FIREBIRD_DSN)",
    "needs_mage: requires a Mage runtime (mage_ai importable)",
]
addopts = "-ra --strict-markers"
